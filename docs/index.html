<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Lead — business leads from Google Places</title>
  <meta name="description" content="Business leads from Google Places — name, phone, website and a properly split address, straight to csv, excel, pdf or json. Stays inside the free tier on purpose." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="theme-color" content="#e08c48" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📍</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --brand: #e08c48;
      --brand-dark: #b96f34;
      --ink: #2c2a28;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      --theme-color: var(--brand);
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                          "Helvetica Neue", Arial, sans-serif;
    }

    body { color: var(--ink); }

    .sidebar { border-right: 1px solid #eee9e4; }
    .sidebar ul li a { color: #4a4540; }
    .sidebar ul li a:hover,
    .sidebar ul li.active > a { color: var(--brand-dark); font-weight: 600; }
    .sidebar > h1 .app-name-link { color: var(--brand-dark); font-weight: 700; }
    .sidebar strong { color: #8a827a; font-size: 12px; letter-spacing: .08em;
                      text-transform: uppercase; }

    .markdown-section h1,
    .markdown-section h2 { letter-spacing: -.01em; }
    .markdown-section h2 { padding-top: .4em; border-bottom: 1px solid #f0ece7;
                           padding-bottom: .3em; }
    .markdown-section a { color: var(--brand-dark); }
    .markdown-section strong { color: #1f1d1b; }

    /* Terminal transcripts are the house style — make them look the part. */
    .markdown-section pre,
    .markdown-section pre > code {
      background: #241f1b; color: #f3ece5; font-family: var(--mono);
      font-size: 13px; line-height: 1.55; border-radius: 8px;
    }
    .markdown-section pre { box-shadow: none; padding: 1em 1.1em; }
    .markdown-section pre::after { content: none; }
    .markdown-section code { font-family: var(--mono); }
    .markdown-section p > code,
    .markdown-section li > code,
    .markdown-section td > code {
      background: #f6f1eb; color: #8a4a1c; padding: 2px 5px; border-radius: 4px;
    }

    .markdown-section table { display: table; width: 100%; }
    .markdown-section tr:nth-child(2n) { background: #fbf8f5; }
    .markdown-section th { background: #f6f1eb; text-align: left; }
    .markdown-section blockquote { border-left: 4px solid var(--brand);
                                   background: #fdf8f3; color: #4a4540; }

    .cover.show { background: radial-gradient(circle at 30% 20%, #fdf3e9, #f7eadc 60%,
                                              #efe0cf) !important; }
    .cover h1 { font-weight: 800; letter-spacing: -.03em; }
    .cover-main > p:first-of-type { color: #6b625a; }
    .cover-main .buttons a { border-radius: 6px; }
    .app-sub-sidebar li::before { color: var(--brand); }
    .docsify-copy-code-button { background: var(--brand) !important; }
  </style>
</head>
<body>
  <div id="app">Loading Business Lead docs…</div>

  <script>
    window.$docsify = {
      name: 'Business Lead',
      nameLink: '#/',
      repo: 'https://github.com/DarkVertana/Business-Lead',
      logo: null,

      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      relativePath: false,
      externalLinkTarget: '_blank',

      search: {
        placeholder: 'Search the docs',
        noData: 'Nothing here for that.',
        depth: 3,
        hideOtherSidebarContent: false,
      },

      pagination: {
        previousText: 'Back',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Failed',
        successText: 'Copied',
      },

      notFoundPage: true,
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
</body>
</html>
