name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # one Windows job is enough to prove the paths and the console
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyflakes

      - name: Lint
        run: pyflakes businesslead tools

      - name: Import and CLI
        run: |
          python -c "import businesslead; print(businesslead.APP_TITLE, businesslead.VERSION)"
          python -m businesslead --version
          python -m businesslead --help > /dev/null

      # These need no API key: the datasets ship with the package.
      - name: Offline checks
        run: |
          python -m businesslead.validate.gazetteer "Austin, TX, USA" "560001, Bangalore, India"
          python -m businesslead.validate.place_types "coffee shop" "chemist"
          python -m businesslead.validate.gazetteer --stats

      - name: Where it keeps things
        run: python -c "from businesslead import paths; print(paths.state_dir()); print(paths.cache_dir())"
