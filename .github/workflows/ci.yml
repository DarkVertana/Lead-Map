name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyflakes

      - name: Lint
        run: pyflakes leadmap tools

      - name: Import and CLI
        run: |
          python -c "import leadmap; print(leadmap.APP_TITLE, leadmap.VERSION)"
          python -m leadmap --version
          python -m leadmap --help > /dev/null

      # These need no API key: the datasets ship with the package.
      - name: Offline checks
        run: |
          python -m leadmap.validate.gazetteer "Austin, TX" "560001, Bangalore"
          python -m leadmap.validate.place_types "coffee shop" "chemist"
          python -m leadmap.validate.gazetteer --stats
